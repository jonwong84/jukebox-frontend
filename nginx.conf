server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip common text assets for faster loads
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Cache hashed build assets aggressively — Angular fingerprints filenames
    # (e.g. main.a1b2c3d4.js) so a new deploy naturally gets a new URL.
    location ~* \.(?:js|css|woff2?|svg|png|jpg|jpeg|gif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # The SPA fallback: any path that isn't a real file on disk falls back
    # to index.html, letting the Angular router take over from there.
    # This is what makes a direct hit or refresh on e.g. /artists work.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

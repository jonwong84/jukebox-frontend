server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip common text assets for faster loads
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Cache fingerprinted build output aggressively. Angular's build hashes
    # these filenames (e.g. main-TBUVAR6U.js), so a new deploy always gets a
    # new URL — safe to cache "forever" since the old URL is simply never
    # reused. Matches a dash + 6+ char alphanumeric hash before .js/.css.
    # try_files still falls back to index.html: a route that happens to end
    # in .js/.css but isn't a real fingerprinted file should still hit the
    # Angular router, not a 404.
    location ~* -[a-zA-Z0-9]{6,}\.(?:js|css)$ {
        try_files $uri /index.html;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Everything else asset-like (favicon.ico, unfingerprinted images,
    # fonts) is NOT guaranteed to change URL when its content changes, so it
    # gets a short cache lifetime instead of "immutable" — otherwise a
    # redeployed favicon.ico could stay stale in clients' caches for a year.
    # try_files still falls back to index.html for the same SPA-route reason
    # as above.
    location ~* \.(?:woff2?|svg|png|jpg|jpeg|gif|ico)$ {
        try_files $uri /index.html;
        expires 1h;
        add_header Cache-Control "public";
    }

    # The SPA fallback: any other path that isn't a real file on disk falls
    # back to index.html, letting the Angular router take over from there.
    # This is what makes a direct hit or refresh on e.g. /artists work.
    location / {
        try_files $uri $uri/ /index.html;
    }
}